<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Ask Brice</title>

    <meta
        name="theme-color"
        content="#0d0d0d">

    <link
        rel="manifest"
        href="manifest.json">

    <link 
        rel="icon" 
        href="assets/icons/bull.svg">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div id="app">

<!-- ==========================================
     LOADING SCREEN
========================================== -->

welcomeScreen">

            <div class="welcomeLogo">

                🐂

            </div>


        🐂

    </div>

    <h2>ASK BRICE</h2>

</div>

<!-- ==========================================
     SIDEBAR
========================================== -->

<aside
    id="sidebar"
    class="sidebar">

    <div class="sidebarHeader">

        <div class="sidebarLogo">

            🐂 ASK BRICE

        </div>

        <button
            id="newChatBtn"
            class="newChatButton">

            + New Chat

        </button>

        <input
            id="searchChats"
            type="text"
            placeholder="Search chats...">

    </div>

    <div
        id="historyList"
        class="historyList"></div>

</aside>

<!-- ==========================================
     HEADER
========================================== -->

<header class="header">

    <button
        id="menuBtn"
        class="iconButton">

        ☰

    </button>

    <div class="bullLogo">
    <img
        src="assets/icons/bull.svg"
        alt="Ask Brice Logo">
</div>

        <div class="logoText">

            ASK BRICE

        </div>

    </div>

    <button
        id="settingsBtn"
        class="iconButton">

        ⚙️

    </button>

</header>

<!-- ==========================================
     MAIN
========================================== -->

<main class="app">

    <section
        id="chatWindow"
        class="chatWindow">

        <div
            id="welcomeScreen"
            class="
            <h1>Ask Brice</h1>

            <p>Bullshit detector.</p>

        </div>

    </section>

    <div
        id="typingIndicator"
        class="typingIndicator hidden">

        <span></span>
        <span></span>
        <span></span>

    </div>

    <div
        id="attachmentPreview"
        class="attachmentPreview"></div>

</main>

<!-- ==========================================
     INPUT BAR
========================================== -->

<footer
    class="bottomBar">

    <button
        id="imageBtn"
        class="circleButton">

        📎

    </button>

    <input
        id="imageInput"
        type="file"
        hidden
        accept="image/*,.pdf,.doc,.docx,.txt">

    <button
        id="cameraBtn"
        class="circleButton">

        📷

    </button>

    <div
        class="promptContainer">

        <textarea
            id="prompt"
            rows="1"
            autocomplete="off"
            placeholder="What's your bullshit today?"></textarea>

    </div>

    <button
        id="micBtn"
        class="circleButton">

        🎙️

    </button>

    <button
        id="sendBtn"
        class="circleButton sendButton">

        💩

    </button>

</footer>

<!-- ==========================================
     SETTINGS PANEL
========================================== -->

<div
    id="settingsPanel"
    class="settingsPanel hidden">

    <h2>Settings</h2>

</div>

<!-- ==========================================
     MESSAGE TEMPLATE
========================================== -->

<template id="messageTemplate">

    <div class="message">

        <div class="messageContent"></div>

        <div class="messageActions">

            <button class="actionBtn copyBtn">

                📋

            </button>

            <button class="actionBtn speakBtn">

                🔊

            </button>

        </div>

    </div>

</template>

</div>

<script type="module" src="js/app.js"></script>

</body>

</html>
